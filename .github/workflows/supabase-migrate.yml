name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrate.yml'

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history — needed for old-migration-edit detection

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.20.5

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      # ── GATE 1: Schema drift ──
      - name: Detect schema drift
        run: |
          echo "::group::Schema Drift Check"
          if ! supabase db diff --linked --exit-code; then
            echo "::error::SCHEMA DRIFT — production has changes not in migrations."
            echo "## ❌ Schema Drift Detected" >> $GITHUB_STEP_SUMMARY
            echo "Production schema differs from migrations. Someone edited the DB manually." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Fix:** Write a migration to capture the drift, or revert the manual change." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✓ No drift."
          echo "::endgroup::"

      # ── GATE 2: Old migration edit detection ──
      - name: Block edited old migrations
        run: |
          echo "::group::Migration Integrity Check"
          # Detect MODIFIED (not added) migration files — editing applied migrations is forbidden
          MODIFIED=$(git diff --name-only --diff-filter=M HEAD~1 HEAD -- supabase/migrations/ || true)
          if [ -n "$MODIFIED" ]; then
            echo "::error::BLOCKED — You edited an existing migration file. This breaks migration tracking."
            echo "$MODIFIED"
            echo "## ❌ Migration File Edited" >> $GITHUB_STEP_SUMMARY
            echo "Editing applied migrations is forbidden. Write a NEW migration instead." >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$MODIFIED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✓ No existing migrations were edited."
          echo "::endgroup::"

      # ── GATE 3: Validate new migrations ──
      - name: Validate migration files
        run: |
          echo "::group::Migration Validation"
          ADDED=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- supabase/migrations/ || true)

          if [ -z "$ADDED" ]; then
            echo "No new migration files."
            echo "::endgroup::"
            exit 0
          fi

          echo "New migrations:"
          echo "$ADDED"
          echo ""

          ERRORS=0

          for file in $ADDED; do
            [ ! -f "$file" ] && continue
            BASENAME=$(basename "$file")

            # ── Check naming: must be YYYYMMDDHHMMSS_snake_case.sql ──
            if ! echo "$BASENAME" | grep -qE '^[0-9]{14}_[a-z][a-z0-9_]*\.sql$'; then
              echo "::error file=$file::Bad filename. Expected: YYYYMMDDHHMMSS_snake_case.sql"
              ERRORS=$((ERRORS + 1))
            fi

            # ── Check not empty ──
            CONTENT=$(cat "$file" | sed '/^[[:space:]]*$/d' | sed '/^--/d')
            if [ -z "$CONTENT" ]; then
              echo "::error file=$file::Migration file is empty (no SQL statements)."
              ERRORS=$((ERRORS + 1))
              continue
            fi

            LINES=$(wc -l < "$file")

            # ── Check backward compatibility (FAIL, not warn) ──
            if grep -qiE '^\s*ALTER\s+TABLE\s+\S+\s+DROP\s+COLUMN' "$file"; then
              echo "::error file=$file::DROP COLUMN detected. Use two-phase deploy: remove from app first, then drop."
              ERRORS=$((ERRORS + 1))
            fi

            if grep -qiE '^\s*ALTER\s+TABLE\s+\S+\s+RENAME\s+COLUMN' "$file"; then
              echo "::error file=$file::RENAME COLUMN detected. Use add→migrate→remove pattern instead."
              ERRORS=$((ERRORS + 1))
            fi

            # ── Warn on other destructive operations ──
            if grep -qiE '^\s*(DROP\s+TABLE|TRUNCATE|DELETE\s+FROM)' "$file"; then
              echo "::warning file=$file::Destructive SQL (DROP TABLE/TRUNCATE/DELETE). Verify this is intentional."
            fi

            if grep -qiE '^\s*ALTER\s+.*\s+TYPE\s' "$file"; then
              echo "::warning file=$file::ALTER TYPE detected. This locks the table and may fail on large tables."
            fi

            # ── Size warning ──
            if [ "$LINES" -gt 500 ]; then
              echo "::warning file=$file::Large migration ($LINES lines). Consider splitting."
            fi

            echo "  ✓ $BASENAME ($LINES lines)"
          done

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "::error::$ERRORS migration error(s) found. Fix before merging."
            echo "## ❌ Migration Validation Failed ($ERRORS errors)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo ""
          echo "✓ All migrations pass validation."
          echo "::endgroup::"

      # ── GATE 4: SQL lint ──
      - name: Lint SQL
        run: |
          echo "::group::SQL Lint"
          if ! supabase db lint; then
            echo "::warning::SQL lint reported issues (non-blocking)."
          fi
          echo "::endgroup::"

      # ── DEPLOY ──
      - name: Push migrations
        id: push
        run: |
          set -o pipefail
          supabase db push --linked 2>&1 | tee /tmp/push-output.txt
          echo "✓ Migrations applied successfully."

      # ── REPORT ──
      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            echo "## ✅ Migrations Applied" >> $GITHUB_STEP_SUMMARY
            ADDED=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- supabase/migrations/ || echo "none")
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$ADDED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.push.outcome }}" = "failure" ]; then
            echo "## ❌ Migration Push Failed" >> $GITHUB_STEP_SUMMARY
            if [ -f /tmp/push-output.txt ]; then
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -50 /tmp/push-output.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi
